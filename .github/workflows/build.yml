name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare debug signing directory
        run: mkdir -p /home/runner/.android

      - name: Preserve debug signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build LSPosed APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: gms-fastpair-diagnostics-debug
          path: app/build/outputs/apk/debug/app-debug.apk
