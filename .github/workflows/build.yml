name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare debug signing directory
        run: mkdir -p /home/runner/.android

      - name: Preserve debug signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Install canonical debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" \
              | base64 --decode \
              > /home/runner/.android/debug.keystore
          fi

      - name: Create debug signing key when absent
        run: |
          if [ ! -f /home/runner/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore /home/runner/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build LSPosed APK
        env:
          CI_DEBUG_KEYSTORE: /home/runner/.android/debug.keystore
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-tag-find-hub-fix-debug
          path: app/build/outputs/apk/debug/app-debug.apk
